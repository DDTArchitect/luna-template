name: "Validate & Build"

on:
 workflow_call:

jobs:
 Sanity:
  name: Build
  runs-on: ubuntu-latest

  steps:
   - uses: actions/checkout@v4

   - name: Install pnpm 📥
     uses: pnpm/action-setup@v4
     with:
      version: latest

   # No `cache: pnpm` here — it needs a committed pnpm-lock.yaml and .gitignore excludes it,
   # so setup-node fails with "Dependencies lock file is not found" before install ever runs
   - name: Install Node.js 📥
     uses: actions/setup-node@v4
     with:
      node-version: latest

   - name: Install dependencies 📥
     run: pnpm install

   - name: Build
     run: pnpm run build

   - name: Upload Build Artifacts
     uses: actions/upload-artifact@v4
     with:
      name: luna-artifacts
      path: ./dist
